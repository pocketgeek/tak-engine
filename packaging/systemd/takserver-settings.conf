# Optional /etc/systemd/system/takserver.service.d/settings.conf.
# Copy this template, change the values you need, then daemon-reload and restart.
# Works with the packaged manual-TLS service and current ACME drop-in.
# Do not add ExecStart here: both certificate modes use these variables.
[Service]
# Readable retail data must stay outside /home (ProtectHome=yes).
Environment="TAK_SERVER_DATA=/srv/tak-data"
# Keep writable paths under the systemd-managed state directory.
Environment="TAK_SERVER_ACCOUNTS=/var/lib/takserver/accounts.conf"
Environment="TAK_SERVER_MAP_CACHE=/var/lib/takserver/maps"
Environment="TAK_SERVER_REPLAYS=/var/lib/takserver/replays"
# Application defaults. Game-count limits must be 1..64; other limits positive.
Environment="TAK_SERVER_PORT=7677"
Environment="TAK_SERVER_MAX_GAMES=16"
Environment="TAK_SERVER_MAX_RUNNING_GAMES=4"
Environment="TAK_SERVER_MAX_ACCOUNTS=10000"
Environment="TAK_SERVER_MAP_MEMORY_MIB=512"
Environment="TAK_SERVER_MAP_STORAGE_MIB=4096"
Environment="TAK_SERVER_REPLAY_MEMORY_MIB=256"
Environment="TAK_SERVER_REPLAY_STORAGE_MIB=4096"
# Optional additional flags, split into arguments by systemd (not a shell).
# To disable new accounts: Environment="TAK_SERVER_EXTRA_ARGS=--closed-registration"
# Empty keeps registration open. Do not put passwords or private keys here.
Environment="TAK_SERVER_EXTRA_ARGS="

# Systemd resource limits (independent of the application limits above).
MemoryMax=8G
MemorySwapMax=0
TasksMax=128
LimitNOFILE=1024
