# Optional /etc/systemd/system/takserver.service.d/acme.conf.
# REQUIRED: replace YOUR.SERVER.NAME with your public DNS hostname before enabling. --acme-agree-tos records the
# operator's acceptance of the CA subscriber agreement.
[Service]
LoadCredential=
ExecStart=
ExecStart=/usr/bin/takserver --data /srv/tak-data --accounts /var/lib/takserver/accounts.conf --map-cache-dir /var/lib/takserver/maps --replaydir /var/lib/takserver/replays --acme-domain YOUR.SERVER.NAME --acme-agree-tos --acme-state /var/lib/takserver/acme
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
