name: Windows build
run-name: Windows build · ${{ github.ref_name }}

# Builds native Windows x64 (MSYS2/MinGW-w64): uploads a CI artifact and runs the
# determinism gate; on a tag it also attaches the zipped bundle to the GitHub Release.
# (determinism.yml remains the fast, always-on sim gate.)

# Runs on every push to main AS WELL AS on a version tag. It used to be tag-only,
# to keep per-commit CI fast -- and that is how a std::atomic_ref that Apple's libc++
# does not have sat broken in sim.cpp from the commit that introduced it until the
# v0.6.5 tag tried to build it, with a green determinism gate the whole time. A
# platform break is only cheap to fix while you still remember what caused it. The
# release steps below stay guarded on a tag ref, so a main push builds and tests but
# publishes nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach assets to the release (tag builds)

jobs:
  build:
    name: Windows x64 (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nsis
            git
            make
            patch
            mingw-w64-x86_64-nasm
            zip

      # Static Bink/streaming FFmpeg so the bundle plays the door videos with no
      # runtime FFmpeg DLLs (see tools/build-ffmpeg-bink.sh). Cached by FFmpeg version.
      - name: Cache static FFmpeg (Bink)
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-bink
          key: ffmpeg-bink-windows-x64-n7.1.1-stream-v2-${{ hashFiles('tools/build-ffmpeg-bink.sh', 'tools/build-stream-deps.sh', 'tools/ffmpeg-tls-hostname.patch') }}
      - name: Build static FFmpeg (Bink)
        run: ./tools/build-ffmpeg-bink.sh

      - name: Configure + build
        # links MSYS2's static libSDL2.a/libjpeg.a/libz.a (SDL2::SDL2-static
        # + the WIN32 -static flag) so the .exe is fully self-contained -- no bundled DLLs.
        run: |
          cmake -B build -G Ninja -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target takclient takserver cartographer cartographer_document_test cartographer_validation_test detmath_test sim_driver_equiv_test stream_test menu_music_test vfs_names_test audio_device_test nvml_test windowsgpu_test distant_models_test retail_script_test pathsearch_test retail_visual_test mapgen_test map_transfer_test unit_gift_test

      - name: Retail scripts, paths, rendering and map generation
        run: |
          ./build/cartographer_document_test.exe
          ./build/cartographer_validation_test.exe
          ./build/retail_script_test.exe
          ./build/pathsearch_test.exe
          ./build/retail_visual_test.exe
          ./build/mapgen_test.exe
          ./build/map_transfer_test.exe
          ./build/unit_gift_test.exe

      - name: Verify fully static (no SDL2/jpeg/zlib/ffmpeg DLL imports)
        run: |
          imports=$(objdump -p build/takclient.exe | awk '/DLL Name:/{print tolower($3)}')
          echo "$imports"
          if echo "$imports" | grep -qE 'sdl2|jpeg|zlib|libz|libpng|avcodec|avformat|swscale|swresample|avutil|x264|libssl|libcrypto|libvpl|nvml'; then
            echo "::error::takclient.exe still imports a non-static media DLL -- not fully static"; exit 1
          fi
          editor_imports=$(objdump -p build/cartographer.exe | awk '/DLL Name:/{print tolower($3)}')
          if echo "$editor_imports" | grep -qE 'sdl2|jpeg|zlib|libz|libpng|avcodec|avformat|swscale|swresample|avutil'; then
            echo "::error::cartographer imports a non-static media DLL"; exit 1
          fi
          echo "OK: no SDL2/jpeg/zlib/ffmpeg DLL imports -- fully static"

      - name: Windows startup regressions
        run: |
          ./build/vfs_names_test.exe
          ./build/audio_device_test.exe
          ./build/nvml_test.exe
          ./build/windowsgpu_test.exe
          SDL_VIDEODRIVER=dummy ./build/distant_models_test.exe
          subsystem=$(objdump -p build/takclient.exe | grep '^Subsystem')
          [[ "$subsystem" == *"(Windows GUI)"* ]]
          editor_subsystem=$(objdump -p build/cartographer.exe | grep '^Subsystem')
          [[ "$editor_subsystem" == *"(Windows GUI)"* ]]

      - name: Streaming encode test
        run: |
          ./build/stream_test.exe
          ./build/stream_test.exe libx264 overload
          ./build/stream_test.exe libx264 native
          ./build/menu_music_test.exe

      - name: Project version
        run: echo "VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Bundle (exes + required DLLs) + zip
        run: |
          mkdir -p dist-win
          cp build/takclient.exe build/takserver.exe build/cartographer.exe dist-win/
          cp STREAMING-LICENSES.txt dist-win/
          # Safety net: copy any non-system DLL still imported (should be none now that
          # SDL2/jpeg/zlib are static; graceful if a target ends up dynamic anyway).
          ldd build/takclient.exe build/takserver.exe build/cartographer.exe \
            | awk '/mingw64\/bin/ {print $3}' | sort -u \
            | while read -r dll; do cp "$dll" dist-win/; done
          (cd dist-win && zip -r "../takclient-$VERSION-windows-x64.zip" .)

      # Proper installer (NSIS via CPack): installs into Program Files\TAK Engine
      # with Start-menu shortcuts + an uninstaller. Same static binaries as the zip.
      - name: Build installer (NSIS)
        run: |
          (cd build && cpack -G NSIS)
          ls -l build/tak-engine-*-setup.exe

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: takclient-windows-x64
          path: dist-win/

      - name: Upload CI artifact (installer)
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-windows-x64-setup
          path: build/tak-engine-*-setup.exe

      # Debug build: the release binaries are hardened (only --data/--version, no env
      # vars), so ship an unhardened DEBUG bundle for devs who need the CLI flags,
      # TAK_* env hooks, and the headless --mp* harness.
      - name: Configure + build (debug)
        run: |
          cmake -B build-debug -G Ninja -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug --target takclient takserver cartographer

      - name: Bundle (exes + required DLLs) + zip (debug)
        run: |
          mkdir -p dist-win-debug
          cp build-debug/takclient.exe build-debug/takserver.exe build-debug/cartographer.exe dist-win-debug/
          cp STREAMING-LICENSES.txt dist-win-debug/
          ldd build-debug/takclient.exe build-debug/takserver.exe build-debug/cartographer.exe \
            | awk '/mingw64\/bin/ {print $3}' | sort -u \
            | while read -r dll; do cp "$dll" dist-win-debug/; done
          (cd dist-win-debug && zip -r ../takclient-windows-x64-debug.zip .)

      - name: Upload CI artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: takclient-windows-x64-debug
          path: dist-win-debug/

      - name: Determinism gate (cross-platform parity)
        run: |
          expected=dcef618cd2e4d558
          ./build/detmath_test.exe    # accuracy vs libm (fails on tolerance)
          got=$(./build/detmath_test.exe --hash | grep -oE '[0-9a-f]{16}')
          echo "detmath golden: $got (expected $expected)"
          if [ "$got" != "$expected" ]; then
            echo "::error::detmath golden mismatch -- cross-platform lockstep broken"
            exit 1
          fi
          ./build/sim_driver_equiv_test.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh   # gh is on the Windows PATH, not inside msys2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY `
            --title "TAK Engine $env:GITHUB_REF_NAME" --generate-notes --verify-tag 2>$null
          $zip = "takclient-$($env:VERSION)-windows-x64.zip"
          $setup = Get-ChildItem build\tak-engine-*-setup.exe | Select-Object -First 1
          gh release upload $env:GITHUB_REF_NAME `
            $zip takclient-windows-x64-debug.zip $setup.FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
