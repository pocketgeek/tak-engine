name: windows

# Native Windows x64 build via MSYS2/MinGW-w64 (the same GCC family the code is
# cross-built with on Linux). Produces a self-contained bundle (exes + the SDL2/
# jpeg/zlib DLLs; the GCC/C++ runtime is static-linked) and runs the two
# determinism gates to confirm cross-platform lockstep parity.

on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  mingw64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib

      - name: Configure
        run: cmake -B build -G Ninja -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle (exes + required DLLs)
        run: |
          mkdir -p dist-win
          cp build/takview.exe build/takserver.exe dist-win/
          # Copy every non-system DLL the exes actually import (SDL2/jpeg/zlib).
          ldd build/takview.exe build/takserver.exe \
            | awk '/mingw64\/bin/ {print $3}' | sort -u \
            | while read -r dll; do cp "$dll" dist-win/; done
          ls -l dist-win

      - name: Read version
        id: ver
        run: echo "v=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: takview-${{ steps.ver.outputs.v }}-windows-x64
          path: dist-win/

      - name: Determinism gates (cross-platform parity)
        # Assert the detmath golden matches the baseline -- the hard cross-platform
        # lockstep gate, here on native Windows x64 (MinGW). Update `expected` only
        # if src/sim/detmath.cpp deliberately changes it (then also the Linux golden).
        run: |
          expected=ab1ef54ae324bd0e
          ./build/detmath_test.exe    # accuracy vs libm (fails on tolerance)
          got=$(./build/detmath_test.exe --hash | grep -oE '[0-9a-f]{16}')
          echo "detmath golden: $got (expected $expected)"
          if [ "$got" != "$expected" ]; then
            echo "::error::detmath golden mismatch -- cross-platform lockstep broken"
            exit 1
          fi
          ./build/sim_driver_equiv_test.exe
