name: macos

# Native macOS ARM64 (Apple Silicon) build on GitHub's macos-14 runners. The
# source is Unix-clean (BSD sockets, fork/exec, clock_gettime), so this is a plain
# native build with Homebrew SDL2/jpeg. Also runs the two determinism gates to
# confirm cross-platform lockstep parity with the Linux/Windows builds.

on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

jobs:
  arm64:
    runs-on: macos-14   # Apple Silicon (ARM64)
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja sdl2 jpeg-turbo

      - name: Configure
        # Point CMake at Homebrew SDL2, and pin jpeg-turbo explicitly: FindJPEG
        # otherwise resolves to Mono.framework's ancient libjpeg (whose jpeg_mem_src
        # lacks the const 2nd arg and fails to compile). CMAKE_FIND_FRAMEWORK=LAST
        # deprioritises frameworks generally.
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_FIND_FRAMEWORK=LAST
          -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2)"
          -DJPEG_INCLUDE_DIR="$(brew --prefix jpeg-turbo)/include"
          -DJPEG_LIBRARY="$(brew --prefix jpeg-turbo)/lib/libjpeg.dylib"

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist-macos
          cp build/takview build/takserver dist-macos/

      - uses: actions/upload-artifact@v7
        with:
          name: takview-macos-arm64
          path: dist-macos/

      - name: Determinism gates (cross-platform parity)
        # Assert the detmath golden matches the baseline -- the hard cross-platform
        # lockstep gate, here on real Apple-silicon ARM64. Update `expected` only if
        # src/sim/detmath.cpp deliberately changes it (then also the Linux golden).
        run: |
          expected=ab1ef54ae324bd0e
          ./build/detmath_test    # accuracy vs libm (fails on tolerance)
          got=$(./build/detmath_test --hash | grep -oE '[0-9a-f]{16}')
          echo "detmath golden: $got (expected $expected)"
          if [ "$got" != "$expected" ]; then
            echo "::error::detmath golden mismatch -- cross-platform lockstep broken"
            exit 1
          fi
          ./build/sim_driver_equiv_test
