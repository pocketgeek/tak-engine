name: macOS build
run-name: macOS build · ${{ github.ref_name }}

# Builds native macOS ARM64 (Apple Silicon) only on a version-bump tag (v*), or on
# manual dispatch. Uploads a CI artifact + runs the determinism gate; on a tag it
# also attaches the zipped bundle to the GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS ARM64
    runs-on: macos-14   # Apple Silicon (ARM64)
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja sdl2 jpeg-turbo

      - name: Configure + build
        # Pin jpeg-turbo explicitly: FindJPEG otherwise resolves to Mono.framework's
        # ancient libjpeg (whose jpeg_mem_src lacks the const 2nd arg). FIND_FRAMEWORK
        # LAST deprioritises frameworks generally.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2)" \
            -DJPEG_INCLUDE_DIR="$(brew --prefix jpeg-turbo)/include" \
            -DJPEG_LIBRARY="$(brew --prefix jpeg-turbo)/lib/libjpeg.dylib"
          cmake --build build

      - name: Bundle + zip
        run: |
          mkdir -p dist-macos
          cp build/takclient build/takserver dist-macos/
          (cd dist-macos && zip -r ../takclient-macos-arm64.zip .)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: takclient-macos-arm64
          path: dist-macos/

      # Debug build: the release binaries are hardened (only --data/--version, no env
      # vars), so ship an unhardened DEBUG bundle for devs who need the CLI flags,
      # TAK_* env hooks, and the headless --mp* harness.
      - name: Configure + build (debug)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2)" \
            -DJPEG_INCLUDE_DIR="$(brew --prefix jpeg-turbo)/include" \
            -DJPEG_LIBRARY="$(brew --prefix jpeg-turbo)/lib/libjpeg.dylib"
          cmake --build build-debug

      - name: Bundle + zip (debug)
        run: |
          mkdir -p dist-macos-debug
          cp build-debug/takclient build-debug/takserver dist-macos-debug/
          (cd dist-macos-debug && zip -r ../takclient-macos-arm64-debug.zip .)

      - name: Upload CI artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: takclient-macos-arm64-debug
          path: dist-macos-debug/

      - name: Determinism gate (cross-platform parity)
        run: |
          expected=ab1ef54ae324bd0e
          ./build/detmath_test    # accuracy vs libm (fails on tolerance)
          got=$(./build/detmath_test --hash | grep -oE '[0-9a-f]{16}')
          echo "detmath golden: $got (expected $expected)"
          if [ "$got" != "$expected" ]; then
            echo "::error::detmath golden mismatch -- cross-platform lockstep broken"
            exit 1
          fi
          ./build/sim_driver_equiv_test

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            takclient-macos-arm64.zip takclient-macos-arm64-debug.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
