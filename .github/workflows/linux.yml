name: Linux packages
run-name: Linux packages · ${{ github.ref_name }}

# Builds native Linux packages via CPack only on a version-bump tag (v*), or on
# manual dispatch: a .deb on Ubuntu (Debian/Ubuntu family) and a .rpm in a Fedora
# container (Fedora/RHEL family), each in its own environment so the auto-detected
# runtime deps (SDL2/jpeg/zlib sonames) match that family. Each job uploads a CI
# artifact; on a tag it also attaches the package to the GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Debian/Ubuntu (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libsdl2-dev zlib1g-dev libjpeg-dev dpkg-dev
      - name: Build + package (.deb)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          (cd build && cpack -G DEB)
          dpkg-deb -I build/tak-engine-amd64.deb   # show control + auto deps
      # Debug build: the release binaries are hardened (only --data/--version, no env
      # vars). Ship an unhardened DEBUG tarball (not a .deb -- it would collide with the
      # release package's /usr/bin paths) for devs who need the CLI flags, TAK_* env
      # hooks, and the headless --mp* harness.
      - name: Build binaries (debug)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug
          mkdir -p dist-linux-debug
          cp build-debug/takclient build-debug/takserver dist-linux-debug/
          tar -C dist-linux-debug -czf tak-engine-linux-x64-debug.tar.gz .
      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-deb
          path: build/tak-engine-amd64.deb
      - name: Upload CI artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-linux-x64-debug
          path: tak-engine-linux-x64-debug.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            build/tak-engine-amd64.deb tak-engine-linux-x64-debug.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  rpm:
    name: Fedora/RHEL (.rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build + package (.rpm) in a Fedora container
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf -y install cmake ninja-build gcc-c++ SDL2-devel zlib-devel \
                           libjpeg-turbo-devel rpm-build &&
            cmake -B build-rpm -G Ninja -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build-rpm &&
            (cd build-rpm && cpack -G RPM) &&
            rpm -qp --requires build-rpm/tak-engine-x86_64.rpm'
      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-rpm
          path: build-rpm/tak-engine-x86_64.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" build-rpm/tak-engine-x86_64.rpm --repo "$GITHUB_REPOSITORY" --clobber
