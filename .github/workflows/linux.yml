name: Linux packages
run-name: Linux packages · ${{ github.ref_name }}

# Builds native Linux packages via CPack only on a version-bump tag (v*), or on
# manual dispatch: a .deb on Ubuntu (Debian/Ubuntu family) and a .rpm in a Fedora
# container (Fedora/RHEL family), each in its own environment. SDL2/jpeg/zlib and the
# Bink FFmpeg are statically linked (built from source; -DTAK_STATIC_LIBS=ON +
# -DTAK_STATIC_FFMPEG=ON), so the packages are self-contained. Each job uploads a CI
# artifact; on a tag it also attaches the package to the GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Debian/Ubuntu (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          # Build tools + the SDL2 backend -dev headers needed to BUILD a static SDL2 with
          # its X11/Wayland/audio drivers (the libs themselves are built from source below).
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git make dpkg-dev nasm \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      # Build a minimal static Bink-only FFmpeg so the package plays the door videos
      # with NO runtime FFmpeg dependency (see tools/build-ffmpeg-bink.sh). Cached across
      # runs by the FFmpeg version.
      - name: Cache static FFmpeg (Bink)
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-bink
          key: ffmpeg-bink-deb-n7.1.1
      - name: Build static FFmpeg (Bink)
        run: ./tools/build-ffmpeg-bink.sh
      # Build static zlib/libjpeg/SDL2 so the package is self-contained (no libSDL2/jpeg/zlib
      # runtime deps; see tools/build-static-deps.sh). Cached by the lib versions.
      - name: Cache static deps (zlib/libjpeg/SDL2)
        uses: actions/cache@v4
        with:
          path: third_party/static-deps
          key: static-deps-deb-zlib1.3.1-jpeg3.0.4-sdl2.32.10
      - name: Build static deps (zlib/libjpeg/SDL2)
        run: ./tools/build-static-deps.sh
      - name: Build + package (.deb)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAK_STATIC_FFMPEG=ON -DTAK_STATIC_LIBS=ON
          cmake --build build --target takclient takserver   # the package ships only these two
          (cd build && cpack -G DEB)
          dpkg-deb -I build/tak-engine-*.deb   # show control + auto deps
      # Debug build: the release binaries are hardened (only --data/--version, no env
      # vars). Ship an unhardened DEBUG tarball (not a .deb -- it would collide with the
      # release package's /usr/bin paths) for devs who need the CLI flags, TAK_* env
      # hooks, and the headless --mp* harness.
      - name: Build binaries (debug)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTAK_STATIC_FFMPEG=ON -DTAK_STATIC_LIBS=ON
          cmake --build build-debug --target takclient takserver
          mkdir -p dist-linux-debug
          cp build-debug/takclient build-debug/takserver dist-linux-debug/
          tar -C dist-linux-debug -czf tak-engine-linux-x64-debug.tar.gz .
      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-deb
          path: build/tak-engine-*.deb
      - name: Upload CI artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-linux-x64-debug
          path: tak-engine-linux-x64-debug.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            build/tak-engine-*.deb tak-engine-linux-x64-debug.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

  rpm:
    name: Fedora/RHEL (.rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A minimal static Bink-only FFmpeg is built inside the container and linked
      # statically (-DTAK_STATIC_FFMPEG=ON), so the .rpm plays the door videos with NO
      # runtime FFmpeg -- stock Fedora's libavcodec-free lacks the Bink decoder, and we no
      # longer need RPM Fusion. rpm --requires then shows only SDL2/jpeg/zlib.
      - name: Build + package (.rpm) in a Fedora container
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf -y install cmake ninja-build gcc-c++ git make rpm-build nasm \
                 alsa-lib-devel pulseaudio-libs-devel pipewire-devel dbus-devel \
                 libX11-devel libXext-devel libXcursor-devel libXi-devel libXrandr-devel \
                 libXfixes-devel libXScrnSaver-devel libxkbcommon-devel wayland-devel \
                 wayland-protocols-devel libdecor-devel mesa-libGL-devel mesa-libEGL-devel &&
            ./tools/build-ffmpeg-bink.sh &&
            ./tools/build-static-deps.sh &&
            cmake -B build-rpm -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAK_STATIC_FFMPEG=ON -DTAK_STATIC_LIBS=ON &&
            cmake --build build-rpm --target takclient takserver &&
            (cd build-rpm && cpack -G RPM) &&
            rpm -qp --requires build-rpm/tak-engine-*.rpm'
      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tak-engine-rpm
          path: build-rpm/tak-engine-*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" build-rpm/tak-engine-*.rpm --repo "$GITHUB_REPOSITORY" --clobber
