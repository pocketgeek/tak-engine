name: release

# Publish downloadable binaries on a version tag (e.g. `git tag v0.0.1 && git push
# --tags`). Builds Windows x64 and macOS ARM64, zips each self-contained bundle,
# and attaches them to a GitHub Release for the tag. Asset names are version-less
# so the README's `releases/latest/download/...` links always fetch the newest.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release + upload assets

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "TAK Engine $GITHUB_REF_NAME" --generate-notes --verify-tag \
            || echo "release already exists; assets will be updated"

  windows:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib
            zip
      - name: Build
        run: |
          cmake -B build -G Ninja -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Bundle + zip
        run: |
          mkdir -p dist-win
          cp build/takview.exe build/takserver.exe dist-win/
          ldd build/takview.exe build/takserver.exe \
            | awk '/mingw64\/bin/ {print $3}' | sort -u \
            | while read -r dll; do cp "$dll" dist-win/; done
          (cd dist-win && zip -r ../takview-windows-x64.zip .)
      - name: Attach to release
        # gh lives on the Windows PATH (PowerShell), not inside the msys2 shell.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" takview-windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber

  macos:
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ninja sdl2 jpeg-turbo
      - name: Build
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_FIND_FRAMEWORK=LAST
          -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2)"
          -DJPEG_INCLUDE_DIR="$(brew --prefix jpeg-turbo)/include"
          -DJPEG_LIBRARY="$(brew --prefix jpeg-turbo)/lib/libjpeg.dylib"
          && cmake --build build
      - name: Bundle + zip
        run: |
          mkdir -p dist-macos
          cp build/takview build/takserver dist-macos/
          (cd dist-macos && zip -r ../takview-macos-arm64.zip .)
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" takview-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber
